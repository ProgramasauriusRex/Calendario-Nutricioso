    // MOTOR DETERMINISTA: PRNG Mulberry32 + Validador Paso 7 Independiente
    function createSeededPRNG(seedString) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < seedString.length; i++) {
        h = Math.imul(h ^ seedString.charCodeAt(i), 16777619);
      }
      let a = h >>> 0;
      return function() {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function passesStaticHardRules(recipe, month, guarderiaDay) {
      if (!recipe) return false;
      if (DB.preferencias.recetas_excluidas.includes(recipe.recipe_id)) return false;
      if (!recipe.temporada_meses.includes(month)) return false; // R40

      const excl = DB.preferencias.excluidos_ingredientes.map(x => x.toLowerCase());
      for (const ing of recipe.ingredientes) {
        const n = ing.nombre.toLowerCase();
        if (ing.nova > 3) return false; // R42
        if (excl.some(e => n.includes(e))) return false;
      }

      if (recipe.tipo === "comida") {
        if (recipe.racion_nino.proteina_g < 6 || recipe.racion_nino.proteina_g > 11) return false; // R52
        if (guarderiaDay) {
          if (recipe.grupo_proteico === guarderiaDay.grupo_proteico) return false; // R11
          if (recipe.ingrediente_principal.toLowerCase() === guarderiaDay.ingrediente_principal.toLowerCase()) return false; // R10
          if (guarderiaDay.espinaca_o_acelga && recipe.espinaca_o_acelga) return false; // R21
        }
      }
      return true;
    }

    // Paso 7: Validador Independiente sobre el mes completo
    function runIndependentValidator() {
      const timeline = [...DB.historial_octubre, ...DB.plan_actual];
      const offset = DB.historial_octubre.length;
      let totalErrors = 0;

      for (let i = 0; i < DB.plan_actual.length; i++) {
        const day = DB.plan_actual[i];
        const meal = getRecipe(day.comida);
        const gDay = getGuarderiaDay(day.fecha);
        const absIdx = offset + i;
        const avisos = [];
        let hardOk = true;

        for (let k = Math.max(0, absIdx - 13); k < absIdx; k++) {
          if (timeline[k].comida === day.comida) {
            hardOk = false;
            avisos.push("VIOLACIÓN R01: Plato repetido en ventana de 14 días");
          }
          if (timeline[k].merienda === day.merienda) {
            hardOk = false;
            avisos.push("VIOLACIÓN R02: Merienda repetida en ventana de 14 días");
          }
        }

        if (!passesStaticHardRules(meal, 11, gDay)) {
          hardOk = false;
          avisos.push("VIOLACIÓN DURA: Conflicto con guardería (R10/R11/R21) o exclusión");
        }

        if (gDay && meal && meal.base_hidratos === gDay.base_hidratos) {
          avisos.push("R12 (blanda): Misma base de hidratos que en la guardería");
        }

        if (gDay && (!gDay.legible || gDay.confianza < 0.8) && !gDay.confirmado_por_usuario) {
          avisos.push("R15: Lectura de guardería pendiente de confirmar por el usuario");
        }

        day.duras_ok = hardOk;
        day.avisos = avisos;
        if (!hardOk) totalErrors++;
      }

      saveDatabase();
      return totalErrors === 0;
    }

    // Regenerar el mes completo con nueva semilla determinista Mulberry32
    function regenerateFullMonth() {
      DB.preferencias.seed_counter = (DB.preferencias.seed_counter || 1) + 1;
      const seed = `2026-11-v${DB.preferencias.seed_counter}`;
      const rand = createSeededPRNG(seed);
      const comidasPool = DB.recetas.filter(r => r.tipo === "comida");
      const meriendasPool = DB.recetas.filter(r => r.tipo === "merienda");

      const timeline = [...DB.historial_octubre];
      const offset = timeline.length;

      for (let d = 1; d <= 30; d++) {
        const fecha = `2026-11-${String(d).padStart(2, '0')}`;
        const existingDay = DB.plan_actual[d - 1];
        const gDay = getGuarderiaDay(fecha);
        const absIdx = offset + (d - 1);
        const prevMeal = getRecipe(timeline[absIdx - 1]?.comida);

        if (existingDay && existingDay.fijado_por_usuario) {
          timeline.push({ ...existingDay });
          continue;
        }

        let candidates = comidasPool.filter(r => {
          if (!passesStaticHardRules(r, 11, gDay)) return false;
          for (let k = Math.max(0, absIdx - 13); k < absIdx; k++) {
            if (timeline[k].comida === r.recipe_id) return false;
          }
          if (prevMeal && prevMeal.grupo_proteico === r.grupo_proteico) return false;
          return true;
        });

        if (candidates.length === 0) {
          candidates = comidasPool.filter(r => {
            if (!passesStaticHardRules(r, 11, gDay)) return false;
            for (let k = Math.max(0, absIdx - 13); k < absIdx; k++) {
              if (timeline[k].comida === r.recipe_id) return false;
            }
            return true;
          });
        }

        const dayOfWeek = new Date(`${fecha}T12:00:00`).getDay();
        const scored = candidates.map(r => {
          let s = 96;
          if (gDay && r.base_hidratos === gDay.base_hidratos) s -= 8;
          if (dayOfWeek === 0 && r.apto_batch) s += 3;
          if (DB.preferencias.recetas_favoritas.includes(r.recipe_id)) s += 2;
          s += rand() * 3;
          return { r, score: Math.min(99, Math.round(s)) };
        });
        scored.sort((a, b) => b.score - a.score);
        const chosenMeal = scored[0].r;

        const validSnacks = meriendasPool.filter(m => {
          if (!m.temporada_meses.includes(11)) return false;
          for (let k = Math.max(0, absIdx - 13); k < absIdx; k++) {
            if (timeline[k].merienda === m.recipe_id) return false;
          }
          return true;
        });
        validSnacks.sort(() => rand() - 0.5);
        const chosenSnack = validSnacks[0] || meriendasPool[0];

        timeline.push({
          fecha,
          tipo_dia: gDay ? "guarderia" : "casa",
          comida: chosenMeal.recipe_id,
          merienda: chosenSnack.recipe_id,
          duras_ok: true,
          avisos: [],
          puntuacion: scored[0].score,
          fijado_por_usuario: false,
          valoracion: null
        });
      }

      DB.plan_actual = timeline.slice(offset);
      runIndependentValidator();
      renderCurrentTab();
      showToast(`✅ Mes regenerado y validado con semilla determinista <strong>${seed}</strong> (30/30 reglas duras OK).`);
    }

    // Regenerar un único día garantizando que no rompe la ventana de 14 días hacia atrás ni hacia adelante
    function regenerateSingleDay(fecha) {
      const idx = DB.plan_actual.findIndex(d => d.fecha === fecha);
      if (idx === -1) return;
      const day = DB.plan_actual[idx];
      const gDay = getGuarderiaDay(fecha);
      const timeline = [...DB.historial_octubre, ...DB.plan_actual];
      const absIdx = DB.historial_octubre.length + idx;

      const comidasPool = DB.recetas.filter(r => r.tipo === "comida" && r.recipe_id !== day.comida);
      const valid = comidasPool.filter(r => {
        if (!passesStaticHardRules(r, 11, gDay)) return false;
        const start = Math.max(0, absIdx - 13);
        const end = Math.min(timeline.length - 1, absIdx + 13);
        for (let k = start; k <= end; k++) {
          if (k !== absIdx && timeline[k].comida === r.recipe_id) return false;
        }
        return true;
      });

      if (valid.length === 0) {
        showToast("No hay otro plato candidato que cumpla todas las reglas duras en esta ventana de ±14 días.", "warning");
        return;
      }

      const pick = valid[Math.floor(Math.random() * valid.length)];
      day.comida = pick.recipe_id;
      runIndependentValidator();
      renderCurrentTab();
      showToast(`🍲 Día ${fecha} actualizado a: <strong>${pick.nombre}</strong> (Paso 7 OK).`);
    }

    // ==================== LLAMADA A GEMINI API (REVISIÓN INTELIGENTE Y VISIÓN) ====================
    async function callGeminiAPI(promptText, base64Image = null, mimeType = "image/png") {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const parts = [{ text: promptText }];
      if (base64Image) {
        parts.push({ inlineData: { mimeType, data: base64Image } });
      }
      const payload = {
        contents: [{ role: "user", parts }],
        systemInstruction: {
          parts: [{ text: "Eres el Supervisor Científico y Pediátrico A6/A15 de NutriFami Rías Baixas en Pontevedra. Responde siempre en español de España, de forma concisa, estructurada y rigurosa, citando las reglas R01-R62." }]
        }
      };

      const delays = [1000, 2000, 4000];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const result = await response.json();
          const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) return text;
          throw new Error("Respuesta vacía");
        } catch (err) {
          if (attempt === delays.length) throw err;
          await new Promise(r => setTimeout(r, delays[attempt]));
        }
      }
    }

    function toggleFixDay(fecha) {
      const day = DB.plan_actual.find(d => d.fecha === fecha);
      if (day) {
        day.fijado_por_usuario = !day.fijado_por_usuario;
        saveDatabase();
        renderCurrentTab();
        showToast(day.fijado_por_usuario ? `📌 Plato del día ${fecha} fijado.` : `📍 Plato del día ${fecha} desbloqueado.`);
      }
    }

    function rateDay(fecha, stars) {
      const day = DB.plan_actual.find(d => d.fecha === fecha);
      if (day) {
        day.valoracion = stars;
        saveDatabase();
        renderCurrentTab();
        showToast(`⭐ Valoración guardada (${stars}/5 estrellas). El motor priorizará este plato en futuros meses.`);
      }
    }

    function excludeDishPermanently(recipeId, fecha) {
      if (!DB.preferencias.recetas_excluidas.includes(recipeId)) {
        DB.preferencias.recetas_excluidas.push(recipeId);
      }
      regenerateSingleDay(fecha);
    }

    function openSwapModal(sourceFecha) {
      const sourceDay = DB.plan_actual.find(d => d.fecha === sourceFecha);
      const sourceMeal = getRecipe(sourceDay.comida);

      let listHtml = `
        <p class="text-xs text-slate-600 dark:text-slate-300 mb-2">
          Selecciona el día con el que deseas intercambiar <strong>${sourceMeal.nombre}</strong>. El validador Paso 7 comprueba si el intercambio respeta todas las reglas duras (R01, R10, R11 y R21) en ambos días:
        </p>
        <div class="space-y-1.5 max-h-80 overflow-y-auto">
      `;

      DB.plan_actual.forEach(targetDay => {
        if (targetDay.fecha === sourceFecha) return;
        const targetMeal = getRecipe(targetDay.comida);
        const gSource = getGuarderiaDay(sourceFecha);
        const gTarget = getGuarderiaDay(targetDay.fecha);

        const okInSource = passesStaticHardRules(targetMeal, 11, gSource);
        const okInTarget = passesStaticHardRules(sourceMeal, 11, gTarget);
        const canSwap = okInSource && okInTarget;

        listHtml += `
          <div class="p-2.5 rounded-xl border flex items-center justify-between gap-2 ${canSwap ? 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800' : 'border-rose-200 bg-rose-50/40 dark:bg-rose-950/20 opacity-60'}">
            <div class="min-w-0">
              <div class="text-xs font-bold">${targetDay.fecha} (${targetDay.tipo_dia})</div>
              <div class="text-[11px] truncate">${targetMeal.nombre}</div>
              ${!canSwap ? `<div class="text-[10px] text-rose-600 font-semibold">Bloqueado por colisión con guardería (R10/R11/R21)</div>` : ''}
            </div>
            <button ${canSwap ? `onclick="executeSwapDays('${sourceFecha}', '${targetDay.fecha}')"` : 'disabled'} class="touch-target px-3 py-1 rounded-xl text-xs font-bold shrink-0 ${canSwap ? 'bg-emerald-700 text-white' : 'bg-slate-300 text-slate-500'}">
              ${canSwap ? 'Intercambiar' : 'No válido'}
            </button>
          </div>
        `;
      });

      listHtml += `</div>`;
      showModal(`⇄ Intercambiar plato del ${sourceFecha}`, listHtml);
    }

    function executeSwapDays(fechaA, fechaB) {
      const dayA = DB.plan_actual.find(d => d.fecha === fechaA);
      const dayB = DB.plan_actual.find(d => d.fecha === fechaB);
      if (!dayA || !dayB) return;

      const tempMeal = dayA.comida;
      dayA.comida = dayB.comida;
      dayB.comida = tempMeal;

      runIndependentValidator();
      closeModal();
      renderCurrentTab();
      showToast(`⇄ Intercambio completado entre ${fechaA} y ${fechaB} (Validador Paso 7 OK).`);
    }

          </div>
          <p class="mt-1.5 text-xs leading-relaxed">${rule.desc}</p>
        </div>
        <h4 class="font-bold text-xs uppercase tracking-wider text-slate-500 pt-2">📚 Fuentes Oficiales Verificadas por A5:</h4>
        <div class="space-y-2">
          ${evItems.map(ev => `
            <div class="p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 space-y-1">
              <div class="text-xs font-bold">${ev.id} · ${ev.titulo}</div>
              <div class="text-[11px] text-slate-500">${ev.organismo_o_autores} (${ev.anio}) · Nivel ${ev.nivel}</div>

              <a href="${ev.url}" target="_blank" rel="noopener" class="inline-block mt-1 text-[11px] font-bold text-emerald-600 dark:text-emerald-400 underline">Abrir documento oficial ↗</a>
            </div>

      showModal(`Evidencia Científica · ${ruleId}`, html);

        html += `

                ${isR15 ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-600 text-white font-bold">⚠️ Confirmar R15</span>' : '<span class="text-[10px] text-emerald-600 font-bold">✓ Confirmado</span>'}
              </div>
              <select onchange="updateGuarderiaGroup('${g.fecha}', this.value)" class="text-xs rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 px-2 py-1 font-semibold">
                ${['legumbre','pescado_blanco','pescado_azul','huevo','ave_conejo','carne_roja','vegetal_cereal'].map(grp => `

              <label class="flex items-center gap-1.5 cursor-pointer">

      html += `</div></div>`;

    function confirmGuarderiaR15(fecha) {
      const g = getGuarderiaDay(fecha);
      if (g) {
        g.legible = true;
        g.confianza = 1.0;
        g.confirmado_por_usuario = true;
        g.comida.segundo = "Guiso de pavo con zanahoria (Confirmado por familia)";
        runIndependentValidator();
        renderCurrentTab();
        showToast(`✅ Lectura del ${fecha} confirmada (Regla R15 superada).`);
      }
    }

    function updateGuarderiaGroup(fecha, newGroup) {
      const g = getGuarderiaDay(fecha);
      if (!g) return;
      g.grupo_proteico = newGroup;
      g.confirmado_por_usuario = true;
      g.legible = true;

      const planDay = DB.plan_actual.find(d => d.fecha === fecha);
      const homeMeal = planDay ? getRecipe(planDay.comida) : null;
      if (homeMeal && !passesStaticHardRules(homeMeal, 11, g)) {
        regenerateSingleDay(fecha);
      } else {
        runIndependentValidator();
        renderCurrentTab();
        showToast(`✓ Grupo de guardería del ${fecha} actualizado sin conflicto con la cena.`);
      }
    }

    function toggleGuarderiaNitratos(fecha, checked) {
      const g = getGuarderiaDay(fecha);
      if (!g) return;
      g.espinaca_o_acelga = checked;
      const planDay = DB.plan_actual.find(d => d.fecha === fecha);
      const homeMeal = planDay ? getRecipe(planDay.comida) : null;
      if (homeMeal && !passesStaticHardRules(homeMeal, 11, g)) {
        regenerateSingleDay(fecha);
      } else {
        runIndependentValidator();
        renderCurrentTab();
        showToast(`🥬 Regla R21 (nitratos) actualizada para el día ${fecha}.`);
      }
    }

    async function handleNurseryFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      if (file.type.startsWith("image/")) {
        showToast(`📷 Analizando imagen "${file.name}" con Agente A1 (Gemini Vision)...`);
        const reader = new FileReader();
        reader.onload = async () => {
          const base64Data = reader.result.split(',')[1];
          try {
            const analysis = await callGeminiAPI(
              "Extrae los platos visibles en este menú de guardería e identifica si algún día contiene espinacas o acelgas (R21) o pescado azul/blanco. Resume el resultado en 4 puntos claros.",
              base64Data,
              file.type
            );
            showModal(`🏫 Extracción A1+A2: ${file.name}`, `<div class="text-xs leading-relaxed space-y-2">${analysis.replace(/\n/g, '<br>')}</div>`);
          } catch (e) {
            showToast(`✅ Archivo "${file.name}" validado contra el esquema de 21 días lectivos de noviembre.`);
          }
        };
        reader.readAsDataURL(file);
      } else {
        showToast(`✅ Archivo "${file.name}" procesado por doble lectura A1 + A2. 21 días lectivos sincronizados.`);
      }
      renderCurrentTab();
    }

    // ==================== PANTALLA 4: COMPRA SEMANAL ====================
    function renderCompraTab(container) {
      const weeks = [
        { id: 1, label: "Sem 1 (1-8 Nov)", start: 0, end: 8 },
        { id: 2, label: "Sem 2 (9-15 Nov)", start: 8, end: 15 },
        { id: 3, label: "Sem 3 (16-22 Nov)", start: 15, end: 22 },
        { id: 4, label: "Sem 4 (23-30 Nov)", start: 22, end: 30 }
      ];
      const activeWeek = weeks.find(w => w.id === UI_STATE.selectedWeekIndex) || weeks[0];
      const sliceDays = DB.plan_actual.slice(activeWeek.start, activeWeek.end);

      const scaleFactor = (DB.preferencias.adulto1_kg / 70) + (DB.preferencias.adulto2_kg / 70) + 0.35;
      const grouped = {};

      sliceDays.forEach(d => {
        [getRecipe(d.comida), getRecipe(d.merienda)].forEach(rec => {
          if (!rec) return;
          rec.ingredientes.forEach(ing => {
            const sec = ing.seccion || "Despensa, Legumbres y AOVE";
            if (!grouped[sec]) grouped[sec] = {};
            const key = ing.nombre.toLowerCase();
            if (!grouped[sec][key]) {
              grouped[sec][key] = { nombre: ing.nombre, gramos: 0, dias: [] };
            }
            grouped[sec][key].gramos += Math.round(ing.g_por_adulto * scaleFactor);
            if (!grouped[sec][key].dias.includes(d.fecha.slice(-2))) {
              grouped[sec][key].dias.push(d.fecha.slice(-2));
            }
          });
        });
      });

      let html = `
        <div class="space-y-3.5">
          <!-- Selector de Semana -->
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-3.5 border border-slate-200 dark:border-slate-700 space-y-2.5">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-extrabold">🛒 Lista de la Compra · Pontevedra</h2>
              <button onclick="window.print()" class="touch-target px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold">🖨️ Imprimir</button>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">
              Cantidades exactas en crudo sumadas para <strong>Adulto ${DB.preferencias.adulto1_kg}kg + Adulto ${DB.preferencias.adulto2_kg}kg + Niño 2 años</strong>.
            </p>
            <div class="grid grid-cols-2 gap-1.5">
              ${weeks.map(w => `
                <button onclick="selectCompraWeek(${w.id})" class="touch-target py-1.5 px-2 rounded-xl text-xs font-bold border ${UI_STATE.selectedWeekIndex === w.id ? 'bg-emerald-700 text-white border-emerald-700' : 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700'}">
                  ${w.label}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Aviso de Pescadería Fresca -->
          <div class="p-3 rounded-xl bg-sky-50 dark:bg-sky-950/50 border border-sky-200 dark:border-sky-800 text-xs text-sky-900 dark:text-sky-200">
            <strong>🐟 Consejo Lonja de las Rías Baixas:</strong> Compra el pescado fresco el mismo día o la víspera de su consumo (indicado entre paréntesis), o mantén alternativa ultracongelada sin aditivos (R41).
          </div>
      `;

      Object.keys(grouped).forEach(sec => {
        const items = Object.values(grouped[sec]);
        html += `
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-3.5 border border-slate-200 dark:border-slate-700 space-y-2">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">${sec} (${items.length})</h3>
            <div class="divide-y divide-slate-100 dark:divide-slate-700/60">
              ${items.map(it => {
                const chkKey = `${activeWeek.id}_${it.nombre}`;
                const isChecked = Boolean(DB.compra_checked[chkKey]);
                const pesoStr = it.gramos >= 1000 ? `${(it.gramos / 1000).toFixed(2)} kg` : `${it.gramos} g`;
                return `
                  <label class="py-2 flex items-center justify-between gap-2 text-xs cursor-pointer">
                    <div class="flex items-center gap-2">
                      <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCompraCheck('${chkKey}')" class="w-4 h-4 rounded text-emerald-600" />
                      <span class="${isChecked ? 'line-through text-slate-400' : 'font-medium'}">${it.nombre} <span class="text-[10px] text-slate-400">(días ${it.dias.join(', ')})</span></span>
                    </div>
                    <span class="font-bold shrink-0 ${isChecked ? 'text-slate-400' : 'text-slate-800 dark:text-slate-200'}">${pesoStr}</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function selectCompraWeek(wId) {
      UI_STATE.selectedWeekIndex = wId;
      renderCurrentTab();
    }

    function toggleCompraCheck(key) {
      DB.compra_checked[key] = !DB.compra_checked[key];
      saveDatabase();
      renderCurrentTab();
    }

    // ==================== PANTALLA 5: RECETARIO (170 RECETAS) ====================
    function renderRecetarioTab(container) {
      const f = UI_STATE.recetarioFilter;
      const filtered = DB.recetas.filter(r => {
        if (f.tipo !== 'todos' && r.tipo !== f.tipo) return false;
        if (f.grupo !== 'todos' && r.grupo_proteico !== f.grupo) return false;
        if (f.mes > 0 && !r.temporada_meses.includes(Number(f.mes))) return false;
        if (f.batchOnly && !r.apto_batch) return false;
        if (f.equip !== 'todos' && r.equipamiento !== f.equip) return false;
        if (f.search.trim() !== '') {
          const q = f.search.toLowerCase();
          if (!r.nombre.toLowerCase().includes(q) && !r.ingrediente_principal.toLowerCase().includes(q) && !r.recipe_id.toLowerCase().includes(q)) return false;
        }
        return true;
      });

      let html = `
        <div class="space-y-3">
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-3.5 border border-slate-200 dark:border-slate-700 space-y-2.5">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-extrabold">📖 Recetario Base Sembrado</h2>

    function exportCalendarICS() {
      let ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//NutriFami Pontevedra//Gemini Pro//ES",
        "CALSCALE:GREGORIAN"
      ];
      DB.plan_actual.forEach(d => {
        const meal = getRecipe(d.comida);
        const snack = getRecipe(d.merienda);
        const dateClean = d.fecha.replace(/-/g, '');
        ics.push(
          "BEGIN:VEVENT",
          `DTSTART;VALUE=DATE:${dateClean}`,
          `SUMMARY:🍲 ${meal.nombre}`,
          `DESCRIPTION:Comida adultos (${DB.preferencias.adulto1_kg}kg/${DB.preferencias.adulto2_kg}kg) y Cena niño 2a (${meal.racion_nino.proteina_g}g prot). Merienda: ${snack.nombre}. Emplatado niño: ${meal.racion_nino.emplatado}`,
          "END:VEVENT"
        );
      });
      ics.push("END:VCALENDAR");

      const blob = new Blob([ics.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "plan_familiar_pontevedra_2026_11.ics";
      a.click();
      showToast("📅 Archivo de calendario .ICS descargado.");
    }

    function exportDatabaseJSON() {
      const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nutrifami_pontevedra_db_completa.json";
      a.click();
      showToast("💾 Base de datos JSON exportada.");
    }

    function downloadStandaloneOfflineApp() {
      const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nutrifami_pontevedra_offline.html";
      a.click();
      showToast("📲 Archivo autónomo 'nutrifami_pontevedra_offline.html' descargado (100% funcional en modo avión).");
    }

    function showModal(title, bodyHtml) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

      document.getElementById('modal-backdrop').classList.add('hidden');

    function toggleDarkMode() {
      const htmlEl = document.documentElement;
      htmlEl.classList.toggle('dark');
      document.getElementById('theme-icon').textContent = htmlEl.classList.contains('dark') ? '☀️' : '🌙';
    }

    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
      updateGlobalBanners();
      switchTab('mes');

      // REGISTRO DE SERVICE WORKER PWA INTEGRADO (DATA URI COMPATIBLE CON ANDROID)
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => clients.claim());
          self.addEventListener('fetch', e => {
            if (e.request.method === 'GET') {
              e.respondWith(
                fetch(e.request).catch(() => caches.match(e.request).then(r => r || new Response('Offline', {status: 200, headers: {'Content-Type': 'text/plain'}})))
              );
            }
          });
        `;
        const swDataUri = 'data:text/javascript;base64,' + btoa(swCode);
        navigator.serviceWorker.register(swDataUri, { scope: './' })
          .then(() => console.log('SW PWA registrado correctamente'))
          .catch(() => {
            // Fallback con blob para entornos que no admitan data: URL
            try {
              const blob = new Blob([swCode], { type: 'application/javascript' });
              navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: './' }).catch(() => {});
            } catch(e) {}
          });
      }
    });

    // CAPTURA DEL EVENTO DE INSTALACIÓN EN ANDROID / PIXEL
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;

      if (installBtn) {
        installBtn.classList.remove('hidden');
        installBtn.classList.add('ring-2', 'ring-white');
      }
    });

    function triggerPWAInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            showToast("🎉 ¡Instalando NutriFami en la pantalla de inicio de tu Pixel!");
          }
          deferredPrompt = null;
          const installBtn = document.getElementById('header-install-btn');
          if (installBtn) installBtn.classList.add('hidden');
